<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>行情助手 · 翻译官与异动侦探</title>
  <meta name="description" content="手机端智能体助手形态的行情解读原型：用大白话翻译行情，把异动讲清楚、可验证，可追问。内容不构成投资建议。">
  <link href="style.css" rel="stylesheet" type="text/css">
</head>
<body>
  <div id="app" class="app">

    <!-- ===== 顶部栏：智能体助手身份 ===== -->
    <header class="topbar" id="topbar">
      <div class="topbar-left">
        <div class="bot-avatar">译</div>
      </div>
      <div class="topbar-mid">
        <h1 class="topbar-title">行情助手</h1>
        <div class="topbar-status"><span class="status-dot"></span>在线 · 异动监控运行中</div>
      </div>
      <div class="topbar-right">
        <span class="disclaimer-chip">不构成投资建议</span>
      </div>
    </header>

    <!-- ===== Tab 一：助手（对话主界面，核心载体） ===== -->
    <section class="page chat-page" id="page-chat">
      <div class="disclaimer-strip">本助手所有内容均为公开市场信息的白话解读与归因，不构成投资建议</div>
      <div class="chat-scroll" id="chatScroll">
        <div class="chat-list" id="chatList"></div>
      </div>
      <!-- 底部输入区：快捷追问 chips + 输入框 -->
      <div class="composer">
        <div class="chips" id="chips"></div>
        <div class="input-row">
          <input id="chatInput" type="text" placeholder="问我行情、异动或术语…" autocomplete="off" maxlength="60">
          <button id="sendBtn" class="send-btn" aria-label="发送">↑</button>
        </div>
      </div>
    </section>

    <!-- ===== Tab 二：异动时间线 ===== -->
    <section class="page" id="page-anomaly" hidden>
      <div class="page-scroll" id="anomalyList"></div>
    </section>

    <!-- ===== Tab 三：我的 ===== -->
    <section class="page" id="page-mine" hidden>
      <div class="page-scroll" id="mineList"></div>
    </section>

    <!-- ===== 底部导航 ===== -->
    <nav class="tabbar" id="tabbar">
      <button class="tab-item active" data-tab="chat">
        <span class="tab-ico chat-ico"></span><span class="tab-label">助手</span>
      </button>
      <button class="tab-item" data-tab="anomaly">
        <span class="tab-ico anomaly-ico"></span><span class="tab-label">异动</span>
      </button>
      <button class="tab-item" data-tab="mine">
        <span class="tab-ico mine-ico"></span><span class="tab-label">我的</span>
      </button>
    </nav>
  </div>

  <!-- ===== 推送通知（类手机通知样式，S-1 场景感） ===== -->
  <div class="push-notice" id="pushNotice" hidden>
    <button class="push-close" id="pushClose" aria-label="关闭">×</button>
    <div class="push-app"><span class="push-dot"></span>行情助手 · 异动快报</div>
    <div class="push-time">刚刚 · 主动推送</div>
    <div class="push-title" id="pushTitle"></div>
    <div class="push-sub" id="pushSub"></div>
    <div class="push-action">点按回到对话，查看归因证据链 ›</div>
  </div>

  <!-- ===== 术语气泡（I-3，浮层不打断阅读流；小屏转底部抽屉） ===== -->
  <div class="term-bubble" id="termBubble" hidden>
    <button class="term-bubble-close" id="termBubbleClose" aria-label="关闭">×</button>
    <div class="term-bubble-name" id="termBubbleName"></div>
    <div class="term-bubble-text" id="termBubbleText"></div>
    <div class="term-bubble-example" id="termBubbleExample"></div>
  </div>

  <!-- ===== 首次启动免责声明（I-6） ===== -->
  <div class="compliance-modal" id="complianceModal" hidden>
    <div class="compliance-modal-card">
      <div class="compliance-modal-mark">!</div>
      <h2>使用前请知悉</h2>
      <p>「行情助手 · 翻译官与异动侦探」是一款基于大模型、面向非专业投资者的<b>信息解读</b>智能体助手。</p>
      <p>所有内容均为对公开市场信息的解读与归因分析，<b>不构成任何投资建议</b>，不含荐股、买卖点提示或收益承诺。</p>
      <p class="muted">市场有风险，投资需谨慎。请独立决策，风险自担。</p>
      <button class="btn-primary" id="complianceOk">我已知晓，开始对话</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
